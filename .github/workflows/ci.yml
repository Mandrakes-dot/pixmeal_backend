name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  quality-and-build:
    name: Quality checks and build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://pixmeal:pixmeal@localhost:5432/pixmeal
      JWT_SECRET: test_secret
      JWT_EXPIRES_IN: 1d

      S3_REGION: eu-west-3
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minio99
      S3_SECRET_KEY: minio123
      S3_BUCKET: pixmeal

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixmeal
          POSTGRES_PASSWORD: pixmeal
          POSTGRES_DB: pixmeal
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pixmeal -d pixmeal"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minio99
          MINIO_ROOT_PASSWORD: minio123
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
        command: server /data --console-address ":9001"

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create MinIO bucket
        run: |
          docker run --rm --network host minio/mc:latest sh -c "
            mc alias set local http://localhost:9000 minio99 minio123 &&
            mc mb -p local/pixmeal &&
            mc anonymous set private local/pixmeal
          "

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Build NestJS application
        run: npm run build

      - name: Build Docker image
        run: docker build -t pixmeal-backend:${{ github.sha }} .