version: '3'

tasks:
  install:
    desc: Install dependencies
    cmds:
      - npm ci

  lint:
    desc: Run ESLint static analysis
    cmds:
      - npm run lint

  test:
    desc: Run unit tests
    cmds:
      - npm run test

  test:cov:
    desc: Run unit tests with coverage
    cmds:
      - npm run test:cov

  build:
    desc: Build the NestJS application
    cmds:
      - npm run build

  docker:build:
    desc: Build Docker images
    cmds:
      - docker compose build

  docker:up:
    desc: Start local Docker environment
    cmds:
      - docker compose up -d

  docker:logs:
    desc: Show Docker logs
    cmds:
      - docker compose logs -f

  docker:stop:
    desc: Stop Docker environment
    cmds:
      - docker compose down

  docker:clean:
    desc: Stop Docker environment and remove volumes
    cmds:
      - docker compose down -v

  ci:
    desc: Run local CI sequence
    cmds:
      - task: lint
      - task: test:cov
      - task: build
      - task: docker:build

  deploy:local:
    desc: Deploy stack locally with Docker Compose
    cmds:
      - docker compose up -d --build