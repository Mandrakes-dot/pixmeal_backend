services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixmeal_api
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-pixmeal}:${POSTGRES_PASSWORD:-pixmeal}@db:5432/${POSTGRES_DB:-pixmeal}

      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio99}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio123}
      S3_BUCKET: ${S3_BUCKET:-pixmeal}
      S3_REGION: ${S3_REGION:-eu-west-3}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - pixmeal_network
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  db:
    image: postgres:16-alpine
    container_name: pixmeal_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pixmeal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixmeal}
      POSTGRES_DB: ${POSTGRES_DB:-pixmeal}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pixmeal} -d ${POSTGRES_DB:-pixmeal}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pixmeal_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  minio:
    image: minio/minio:latest
    container_name: pixmeal_minio
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio99}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1' ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - pixmeal_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  createbuckets:
    image: minio/mc:latest
    container_name: pixmeal_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio99} ${MINIO_ROOT_PASSWORD:-minio123};
      mc mb -p local/${S3_BUCKET:-pixmeal};
      mc anonymous set private local/${S3_BUCKET:-pixmeal};
      exit 0;
      "
    networks:
      - pixmeal_network

volumes:
  postgres_data:
  minio_data:

networks:
  pixmeal_network:
    driver: bridge