services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: pixmeal_api_prod
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - uploads_data:/app/uploads
    networks:
      - pixmeal_prod_network

  db:
    image: postgres:16-alpine
    container_name: pixmeal_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - pixmeal_prod_network

volumes:
  postgres_prod_data:
  uploads_data:

networks:
  pixmeal_prod_network:
    driver: bridge